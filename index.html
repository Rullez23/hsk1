<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>汉语之路 HSK 1 Vocabulary Road</title>
<style>
:root{
  --mist:#E3EBE5; --paper:#F8FAF7; --jade:#1F5C4F; --jade2:#2E7D69; --jade-dark:#154238; --jade-soft:#D2E4DA;
  --cinnabar:#B83A24; --cin-dark:#8A2B1A; --cin-soft:#F5DCD5; --ink:#1E2629; --muted:#66776F; --gold:#C9952B; --line:#BCCDC4;
  --han:"Noto Serif SC","Source Han Serif SC","Songti SC","STSong","SimSun",serif;
  --ui:"Avenir Next","Avenir","Segoe UI","Helvetica Neue",system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--mist);color:var(--ink);font-family:var(--ui);-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
button:disabled{cursor:default}
.app{max-width:480px;margin:0 auto;min-height:100vh;position:relative}
.han{font-family:var(--han)}

/* map header */
.top{position:sticky;top:0;z-index:5;background:var(--mist);padding:16px 20px 12px;display:flex;align-items:flex-end;justify-content:space-between;border-bottom:1px solid var(--line)}
.brand .han{font-size:30px;font-weight:700;color:var(--jade);letter-spacing:.08em;line-height:1}
.brand small{display:block;font-size:13px;color:var(--muted);margin-top:5px}
.stats{display:flex;gap:6px}
.chip{background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:5px 11px;font-size:14px;font-weight:600;white-space:nowrap}
.chip b{color:var(--gold)}
.guide{display:flex;gap:10px;align-items:flex-end;margin:4px 0 16px}
.guide .buddy{width:64px;flex:none}
.bubble{background:var(--paper);border:1px solid var(--line);border-radius:16px 16px 16px 4px;padding:12px 14px;font-size:15px;line-height:1.5}
.map-guide{padding:16px 18px 0;margin:0}
.scene{position:absolute;width:106px;pointer-events:none}
.scene.big{width:140px}
.scene svg,.buddy svg,.walker svg,.cloud svg,.dragon-win svg{display:block;width:100%;height:auto}
.walker{position:absolute;width:54px;pointer-events:none;z-index:2;animation:hop 2.4s ease-in-out infinite}
@keyframes hop{0%,80%,100%{transform:translateY(0)}88%{transform:translateY(-6px)}}
.cloud{position:absolute;width:46px;pointer-events:none}
.node{z-index:1}
.sheet-top{display:flex;gap:12px;align-items:flex-start;margin-bottom:14px}
.sheet .buddy{width:54px;flex:none;margin-top:-30px}
.sheet-txt{flex:1;min-width:0}
.stampwrap{position:relative}
.stampwrap .buddy{position:absolute;width:82px;right:-66px;bottom:-14px}
.dragon-win{width:170px;margin:26px auto -10px}

/* map */
.map{position:relative;margin:10px 0 0}
.map>svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.node{position:absolute;transform:translateX(-50%);width:150px;display:flex;flex-direction:column;align-items:center;text-align:center}
.seal{width:78px;height:78px;display:grid;place-items:center;position:relative;transition:transform .12s}
.seal .han{font-size:40px;line-height:1}
.seal.open{background:var(--jade);color:var(--paper);border-radius:50%;box-shadow:0 5px 0 var(--jade-dark)}
.seal.open:active{transform:translateY(3px);box-shadow:0 2px 0 var(--jade-dark)}
.seal.done{background:var(--cinnabar);color:#FBEDE8;border-radius:16px;transform:rotate(-4deg);box-shadow:0 5px 0 var(--cin-dark)}
.seal.done::after{content:"";position:absolute;inset:5px;border:2px solid rgba(255,240,235,.5);border-radius:11px}
.seal.locked{background:var(--paper);color:#B3C2BB;border:2px dashed var(--line);border-radius:50%}
.seal.cur::before{content:"";position:absolute;inset:-9px;border-radius:50%;border:3px solid var(--jade2);animation:pulse 1.8s ease-out infinite}
@keyframes pulse{from{transform:scale(.92);opacity:.9}to{transform:scale(1.28);opacity:0}}
.stars{color:var(--gold);font-size:15px;letter-spacing:2px;margin-top:9px}
.stars span,.bigstars span{color:var(--line)}
.nm{font-weight:700;font-size:15px;margin-top:8px}
.tp{font-size:12.5px;color:var(--muted);line-height:1.35;margin-top:2px}
.locked-label .nm{color:var(--muted)}
.testbtn{margin-top:8px;font-size:13.5px;font-weight:700;color:var(--jade);background:var(--paper);border:1.5px solid var(--jade2);border-radius:99px;padding:5px 14px}
.testbtn:active{transform:translateY(1px)}
.locked-label .testbtn{color:var(--muted);border-color:var(--line);border-style:dashed}
.foot{text-align:center;padding:10px 0 40px}
.link{color:var(--muted);text-decoration:underline;font-size:14px;padding:8px}

/* lesson chrome */
.bar{display:flex;align-items:center;gap:12px;padding:14px 18px;position:sticky;top:0;background:var(--mist);z-index:4}
.x{width:36px;height:36px;border-radius:50%;font-size:26px;line-height:1;color:var(--muted)}
.prog{flex:1;height:12px;background:var(--jade-soft);border-radius:99px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--jade2);border-radius:99px;transition:width .35s}
.count{font-size:14px;color:var(--muted);font-weight:600;min-width:38px;text-align:right}
.hearts{color:var(--cinnabar);font-size:20px;letter-spacing:1px}
.hearts .lost{color:var(--line)}
.screen{padding:6px 20px 220px}
.intro{font-size:15px;line-height:1.55;margin:4px 0 16px;color:var(--ink);background:var(--paper);border-left:4px solid var(--jade2);padding:12px 14px;border-radius:0 12px 12px 0}

/* learn card */
.card{background:var(--paper);border:1px solid var(--line);border-radius:22px;padding:28px 20px 24px;text-align:center}
.card .big{display:block;margin:0 auto;line-height:1.15;color:var(--ink)}
.py{font-size:24px;color:var(--jade);font-weight:600;margin-top:10px}
.en{font-size:19px;margin-top:4px}
.note{font-size:14.5px;line-height:1.5;color:var(--muted);margin:14px auto 0;max-width:32ch}
.speak{margin-top:18px;display:inline-flex;align-items:center;gap:8px;border:2px solid var(--jade-soft);color:var(--jade);font-weight:600;padding:8px 16px;border-radius:99px}
.speak svg,.mini svg{width:18px;height:18px}
.skip{display:block;margin:16px auto 0}
.speakrow{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.qbig+.speakrow,.play+.speakrow{margin-top:4px}

/* dock */
.dock{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:480px;padding:12px 20px calc(16px + env(safe-area-inset-bottom));background:var(--mist);border-top:1px solid var(--line);display:flex;gap:10px;z-index:6}
.btn{flex:1;display:block;width:100%;padding:15px;border-radius:14px;background:var(--jade);color:#fff;font-weight:700;font-size:17px;box-shadow:0 4px 0 var(--jade-dark)}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 var(--jade-dark)}
.btn.red{background:var(--cinnabar);box-shadow:0 4px 0 var(--cin-dark)}
.btn.ghost{background:var(--paper);color:var(--jade);box-shadow:0 4px 0 var(--line);flex:.55}
.btn:disabled{background:#C7D3CD;box-shadow:0 4px 0 #AEBDB5;color:#F1F5F2}
.btn.ghost:disabled{background:var(--paper);color:#B3C2BB}

/* quiz */
.combo{display:inline-block;font-size:13px;font-weight:700;color:var(--gold);border:2px solid var(--gold);border-radius:99px;padding:2px 10px;margin-bottom:8px}
.prompt{font-size:21px;line-height:1.35;font-weight:700;margin:4px 0 14px}
.qbig{background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:20px;text-align:center;position:relative}
.qbig>span{display:block;line-height:1.2}
.qbig small{display:block;font-size:18px;color:var(--jade);margin-top:6px;font-weight:600}
.mini{position:absolute;top:10px;right:10px;width:38px;height:38px;border-radius:50%;background:var(--jade-soft);color:var(--jade);display:grid;place-items:center}
.play{display:grid;place-items:center;width:120px;height:120px;margin:10px auto;border-radius:50%;background:var(--jade);color:var(--paper);box-shadow:0 6px 0 var(--jade-dark)}
.play svg{width:52px;height:52px}
.play:active{transform:translateY(3px);box-shadow:0 3px 0 var(--jade-dark)}
.opts{display:grid;gap:10px;margin-top:18px}
.opts.two{grid-template-columns:1fr 1fr}
.opt{background:var(--paper);border:2px solid var(--line);border-radius:14px;padding:14px 12px;font-size:16.5px;line-height:1.3;text-align:center;min-height:58px;box-shadow:0 3px 0 var(--line)}
.opt.hanopt{font-family:var(--han);font-size:25px}
.opt:active:not(:disabled){transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.opt.right{border-color:var(--jade2);background:var(--jade-soft);box-shadow:0 3px 0 var(--jade2)}
.opt.wrong{border-color:var(--cinnabar);background:var(--cin-soft);box-shadow:0 3px 0 var(--cinnabar)}
.target{font-size:18px;background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:14px 16px;line-height:1.4}
.slot{min-height:72px;border-bottom:2px solid var(--line);display:flex;flex-wrap:wrap;align-content:flex-start;gap:8px;padding:14px 0 10px;margin-top:6px}
.slot.right{border-color:var(--jade2)} .slot.wrong{border-color:var(--cinnabar)}
.bank{display:flex;flex-wrap:wrap;justify-content:center;gap:9px;margin-top:22px}
.tile{font-family:var(--han);font-size:23px;padding:8px 14px;background:var(--paper);border:2px solid var(--line);border-radius:12px;box-shadow:0 3px 0 var(--line)}
.tile.used{visibility:hidden}

/* feedback sheet */
.sheet{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:100%;max-width:480px;padding:18px 20px calc(18px + env(safe-area-inset-bottom));border-radius:22px 22px 0 0;z-index:7;animation:rise .22s ease-out}
@keyframes rise{from{transform:translate(-50%,100%)}to{transform:translate(-50%,0)}}
.sheet.ok{background:var(--jade-soft)} .sheet.no{background:var(--cin-soft)}
.fb-h{display:flex;align-items:baseline;gap:10px;font-weight:700;font-size:22px}
.sheet.ok .fb-h{color:var(--jade)} .sheet.no .fb-h{color:var(--cinnabar)}
.fb-h small{font-size:14px;font-weight:600;opacity:.85}
.fb-h .xp{margin-left:auto;color:var(--gold);font-size:15px}
.fb-b{font-size:15.5px;line-height:1.5;margin-top:6px}
.fb-b .han{font-size:20px}

/* result */
.result{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px 28px 60px}
.stamp{width:150px;height:150px;display:grid;place-items:center;font-size:84px;background:var(--cinnabar);color:#FBEDE8;border-radius:28px;position:relative;transform:rotate(-6deg);box-shadow:0 8px 0 var(--cin-dark)}
.stamp::after{content:"";position:absolute;inset:9px;border:3px solid rgba(255,240,235,.5);border-radius:20px}
.stamp.in{animation:stamp .5s cubic-bezier(.2,1.4,.4,1) both}
@keyframes stamp{0%{transform:scale(2.2) rotate(-14deg);opacity:0}60%{opacity:1}100%{transform:scale(1) rotate(-6deg)}}
.result.fail .stamp{background:var(--paper);color:var(--cinnabar);border:3px dashed var(--cinnabar);box-shadow:none}
.result.fail .stamp::after{display:none}
.result h2{font-size:26px;margin-top:34px}
.result p{font-size:16px;color:var(--muted);margin-top:8px;line-height:1.5;max-width:30ch}
.bigstars{font-size:40px;color:var(--gold);letter-spacing:6px;margin-top:10px}
.actions{width:100%;max-width:340px;display:grid;gap:12px;margin-top:30px}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

.tools{display:flex;gap:8px;flex-wrap:wrap;padding:12px 18px 0 92px}
.tool{background:var(--paper);border:1.5px solid var(--jade2);color:var(--jade);font-weight:700;font-size:14px;padding:8px 14px;border-radius:99px}
.tool.warn{border-color:var(--cinnabar);color:var(--cinnabar)}
.stats{flex-wrap:wrap;justify-content:flex-end}.brand small{white-space:nowrap}
.no-tag{font-size:12.5px;color:var(--muted);font-weight:700;letter-spacing:.04em;text-align:left;margin:-12px 0 2px}
.en2{font-size:14.5px;color:var(--muted);margin-top:3px}
.pyin{width:100%;margin-top:16px;font-size:22px;padding:14px 16px;border-radius:14px;border:2px solid var(--line);background:var(--paper);font-family:var(--ui);color:var(--ink);text-align:center}
.pyin:focus{outline:none;border-color:var(--jade2)}
.pyin.right{border-color:var(--jade2);background:var(--jade-soft)}
.pyin.wrong{border-color:var(--cinnabar);background:var(--cin-soft)}
.pyin.almost{border-color:var(--gold);background:#F6E9C8}
.hint{font-size:13.5px;color:var(--muted);margin-top:8px;line-height:1.45;text-align:center}
.sheet.mid{background:#F6E9C8}.sheet.mid .fb-h{color:#8A6514}
.ltitle{flex:1;font-weight:700;font-size:18px}.ltitle small{display:block;font-weight:500;font-size:13px;color:var(--muted)}
.toggles{display:flex;gap:8px;margin:4px 0 6px}
.tog{flex:1;padding:10px;border-radius:12px;border:2px solid var(--line);background:var(--paper);font-weight:700;font-size:14px;color:var(--muted)}
.tog.on{border-color:var(--jade2);background:var(--jade-soft);color:var(--jade)}
.list .hint{text-align:left;margin:6px 0 10px}
.row{display:grid;grid-template-columns:28px 68px 1fr 1.25fr;gap:8px;align-items:center;padding:7px 2px;border-bottom:1px solid var(--line)}
.row.head{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;border-bottom:2px solid var(--line)}
.no{font-size:12px;color:var(--muted);text-align:right}
.lh{font-family:var(--han);font-size:24px;text-align:left}
.lp{font-size:15px;color:var(--jade);font-weight:600;text-align:left;min-height:32px}
.la{font-size:14.5px;text-align:left;line-height:1.3;min-height:32px}
.hid{background:var(--jade-soft);border-radius:8px;position:relative}
.hid::after{content:"tap";position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);font-size:12px;font-weight:600}
</style>
</head>
<body>
<div class="app" id="app"></div>
<script>
/* ---------------- illustrations (original artwork) ---------------- */
// 小文 Xiǎo Wén, the guide: a young scholar with a jade hairpin and a scroll
function guy(mood='calm'){
  const skin='#F7DCC6', hair='#33261F', robe='#2E7D69', robeD='#1F5C4F', cream='#EAF2ED';
  let eyes, mouth, extra='';
  if(mood==='happy'){
    eyes=`<path d="M42 70 Q48 62 54 70 M66 70 Q72 62 78 70" stroke="${hair}" stroke-width="3.2" fill="none" stroke-linecap="round"/>`;
    mouth=`<path d="M52 80 Q60 92 68 80 Z" fill="#8A2B1A"/><path d="M55.5 85 Q60 89 64.5 85 Q60 83 55.5 85Z" fill="#E7756A"/>`;
    extra=`<path d="M101 30 l2 5 5 2 -5 2 -2 5 -2 -5 -5 -2 5 -2z M15 40 l1.5 3.5 3.5 1.5 -3.5 1.5 -1.5 3.5 -1.5 -3.5 -3.5 -1.5 3.5 -1.5z" fill="#C9952B"/>`;
  } else if(mood==='oops'){
    eyes=`<ellipse cx="48" cy="70" rx="4.2" ry="5.2" fill="${hair}"/><ellipse cx="72" cy="70" rx="4.2" ry="5.2" fill="${hair}"/>
      <circle cx="49.6" cy="68" r="1.6" fill="#fff"/><circle cx="73.6" cy="68" r="1.6" fill="#fff"/>
      <path d="M41 62 L53 58 M79 62 L67 58" stroke="${hair}" stroke-width="2.6" stroke-linecap="round"/>`;
    mouth=`<ellipse cx="60" cy="84" rx="3.6" ry="4.2" fill="#8A2B1A"/>`;
    extra=`<path d="M92 42 Q97 51 92 55 Q87 51 92 42Z" fill="#8EC3DA"/>`;
  } else {
    eyes=`<ellipse cx="48" cy="70" rx="4.2" ry="5.2" fill="${hair}"/><ellipse cx="72" cy="70" rx="4.2" ry="5.2" fill="${hair}"/>
      <circle cx="49.6" cy="68" r="1.6" fill="#fff"/><circle cx="73.6" cy="68" r="1.6" fill="#fff"/>
      <path d="M42 60 Q47 57 53 59 M67 59 Q73 57 78 60" stroke="${hair}" stroke-width="2.4" fill="none" stroke-linecap="round"/>`;
    mouth=`<path d="M55 81 Q60 86 65 81" stroke="#8A2B1A" stroke-width="2.4" fill="none" stroke-linecap="round"/>`;
  }
  return `<svg viewBox="0 0 120 160" aria-hidden="true">
  <ellipse cx="60" cy="152" rx="30" ry="5" fill="#1F5C4F" opacity=".15"/>
  <ellipse cx="49" cy="147" rx="9" ry="5" fill="#3A2C26"/><ellipse cx="71" cy="147" rx="9" ry="5" fill="#3A2C26"/>
  <path d="M40 94 Q60 88 80 94 L92 144 Q60 150 28 144 Z" fill="${robe}"/>
  <path d="M30 137 Q60 143 90 137 L92 144 Q60 150 28 144Z" fill="#C9952B"/>
  <path d="M50 91 L60 110 L70 91 Z" fill="${cream}"/>
  <path d="M50 91 L66 114 L72 110 L57 91Z" fill="${robeD}"/>
  <rect x="36" y="112" width="48" height="8" rx="2" fill="#C9952B"/>
  <circle cx="60" cy="116" r="4" fill="#B83A24"/><path d="M59 120 L56 134 M61 120 L64 134" stroke="#B83A24" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M42 96 Q24 104 22 127 Q31 134 41 127 L45 104Z" fill="${robe}"/>
  <path d="M22 127 Q31 134 41 127 L41 123 Q31 129 22.5 123Z" fill="${cream}"/>
  <path d="M78 96 Q96 104 98 127 Q89 134 79 127 L75 104Z" fill="${robe}"/>
  <path d="M98 127 Q89 134 79 127 L79 123 Q89 129 97.5 123Z" fill="${cream}"/>
  <g transform="rotate(-22 89 128)"><rect x="84" y="108" width="11" height="30" rx="2" fill="#F5EBD3"/>
    <rect x="82" y="106" width="15" height="4" rx="2" fill="#B83A24"/><rect x="82" y="136" width="15" height="4" rx="2" fill="#B83A24"/>
    <path d="M87 115 h5 M87 120 h5 M87 125 h4" stroke="#8A5A3C" stroke-width="1.2"/></g>
  <circle cx="31" cy="131" r="6" fill="${skin}"/><circle cx="89" cy="131" r="6" fill="${skin}"/>
  <rect x="55" y="86" width="10" height="8" fill="${skin}"/>
  <circle cx="60" cy="22" r="13" fill="${hair}"/>
  <path d="M42 18 L80 25" stroke="#8FC3B0" stroke-width="3.5" stroke-linecap="round"/><circle cx="80.5" cy="25" r="3.6" fill="#C9952B"/>
  <ellipse cx="60" cy="60" rx="39" ry="37" fill="${hair}"/>
  <circle cx="25" cy="69" r="6" fill="${skin}"/><circle cx="95" cy="69" r="6" fill="${skin}"/>
  <ellipse cx="60" cy="66" rx="34" ry="32" fill="${skin}"/>
  <path d="M26 64 Q25 30 60 28 Q95 30 94 64 Q89 48 77 44 Q71 53 60 46 Q49 53 43 44 Q31 48 26 64Z" fill="${hair}"/>
  <path d="M50 32 Q60 36 70 32" stroke="#B83A24" stroke-width="3" fill="none" stroke-linecap="round"/>
  <ellipse cx="40" cy="79" rx="6" ry="3.5" fill="#F2A399" opacity=".75"/><ellipse cx="80" cy="79" rx="6" ry="3.5" fill="#F2A399" opacity=".75"/>
  ${eyes}${mouth}${extra}</svg>`;
}
const CLOUD = `<svg viewBox="0 0 56 30" aria-hidden="true"><path d="M10 22 Q4 22 6 16 Q8 11 14 13 Q17 5 27 7 Q35 3 40 11 Q50 10 50 18 Q52 24 44 24 L12 24Z" fill="#fff" opacity=".9"/><path d="M18 18 Q24 14 30 18" stroke="#CFE0D7" stroke-width="2" fill="none" stroke-linecap="round"/></svg>`;
function bambooStalks(list){
  return list.map(([x,h,c])=>{ const y=78-h; let segs='';
    for(let yy=y+12; yy<76; yy+=13) segs+=`<rect x="${x-.5}" y="${yy}" width="7" height="2" rx="1" fill="#1F5C4F" opacity=".55"/>`;
    return `<rect x="${x}" y="${y}" width="6" height="${h}" rx="3" fill="${c}"/>${segs}
      <ellipse cx="${x+12}" cy="${y+8}" rx="9" ry="2.8" fill="#7FBF9A" transform="rotate(-28 ${x+12} ${y+8})"/>
      <ellipse cx="${x-6}" cy="${y+20}" rx="8" ry="2.6" fill="#5FA383" transform="rotate(30 ${x-6} ${y+20})"/>`; }).join('');
}
const SCENES = {
  valley:()=>`<svg viewBox="0 0 100 80" aria-hidden="true"><circle cx="76" cy="20" r="10" fill="#F2C14E"/>
    <path d="M0 72 L28 28 L44 50 L60 24 L100 72 Z" fill="#8DBBA6"/>
    <path d="M28 28 L22 38 L28 35 L33 40 Z M60 24 L54 34 L60 31 L66 35Z" fill="#fff" opacity=".9"/>
    <path d="M0 76 L20 52 L38 66 L62 44 L100 76 Z" fill="#2E7D69"/>
    <path d="M8 64 Q28 58 48 64 T92 64" stroke="#fff" stroke-width="2" fill="none" opacity=".65" stroke-linecap="round"/>

/* speech + sound */
const canSpeak = 'speechSynthesis' in window;
let zhVoice = null, voiceOK = false;
function pickVoice(){ if(!canSpeak) return; const vs=speechSynthesis.getVoices(); zhVoice=vs.find(v=>/zh[-_]CN/i.test(v.lang))||vs.find(v=>/^zh/i.test(v.lang))||null; voiceOK=!!zhVoice; }
if(canSpeak){ pickVoice(); speechSynthesis.onvoiceschanged=pickVoice; }
let lastUtter=null, sayTimer=null, speechPrimed=false;
function primeSpeech(){ // iOS only allows speech after a direct tap; unlock it once
  if(speechPrimed||!canSpeak) return; speechPrimed=true;
  try{ const u=new SpeechSynthesisUtterance(' '); u.volume=0; speechSynthesis.speak(u); }catch(e){}
}
function say(t, slow){
  if(!canSpeak||!t) return;
  try{
    speechSynthesis.cancel(); clearTimeout(sayTimer);
    const clean=t.replace(/\//g,'，');
    const n=[...clean.replace(/[^\u4e00-\u9fff]/g,'')].length;
    // single syllables get the slowest rate so the tone is fully audible
    let rate = n<=1 ? .55 : n<=3 ? .65 : .75;
    if(slow) rate*=.7;
    // short pause after cancel(): speaking immediately makes Chrome/Android clip the start
    sayTimer=setTimeout(()=>{
      const u=new SpeechSynthesisUtterance(clean+'。'); // ending punctuation stops the voice cutting off the tail
      u.lang='zh-CN'; if(zhVoice) u.voice=zhVoice; u.rate=rate; u.pitch=1; u.volume=1;
      lastUtter=u; // hold a reference so the browser doesn't drop it mid-sentence
      speechSynthesis.speak(u);
    },180);
  }catch(e){}
}
let actx;
function beep(ok){ try{ actx=actx||new (window.AudioContext||window.webkitAudioContext)(); const t0=actx.currentTime;
  (ok?[660,990]:[300,220]).forEach((f,i)=>{ const o=actx.createOscillator(),g=actx.createGain(); o.type='triangle'; o.frequency.value=f;
    const s=t0+i*.1; g.gain.setValueAtTime(.0001,s); g.gain.exponentialRampToValueAtTime(.15,s+.02); g.gain.exponentialRampToValueAtTime(.0001,s+.2);
    o.connect(g).connect(actx.destination); o.start(s); o.stop(s+.22); }); }catch(e){} }

/* ---------------- question factory ---------------- */
const M  = w => state.lang==='en'?w.en:w.id;   // meaning in chosen language
const M2 = w => state.lang==='en'?w.id:w.en;   // the other language
function distract(ans, get, pool, skip){
  const seen=new Set([ans]), out=[];
  for(const src of [pool, ORDER]) for(const w of shuffle(src)){
    if(out.length>=3) break; if(skip&&skip(w)) continue;
    const v=get(w); if(!seen.has(v)){ seen.add(v); out.push(v); } }
  return out;
}
function mcVocab(w, pool){
  const types=['meaning','meaning','pinyin','hanzi']; if(voiceOK) types.push('listen');
  const t=types[Math.random()*types.length|0];
  const base={kind:'mc',w,say:w.h,reveal:`<span class="han">${w.h}</span> ${esc(w.p)}, ${esc(M(w))}`};
  if(t==='meaning'){ const a=M(w); return {...base,prompt:'What does this mean?',big:w.h,speak:w.h,answer:a,options:shuffle([a,...distract(a,M,pool)]),font:'ui'}; }
  if(t==='pinyin') return {...base,prompt:'Which pinyin is correct?',big:w.h,answer:w.p,options:shuffle([w.p,...distract(w.p,x=>x.p,pool)]),font:'ui'};
  if(t==='hanzi') return {...base,prompt:`Which one means "${M(w)}"?`,answer:w.h,options:shuffle([w.h,...distract(w.h,x=>x.h,pool)]),font:'han'};
  return {...base,prompt:'Listen, then pick what you hear',listen:true,speak:w.h,autoplay:true,answer:w.h,
    options:shuffle([w.h,...distract(w.h,x=>x.h,pool,x=>x.p.toLowerCase()===w.p.toLowerCase())]),font:'han'};
}
const typeQ = w => ({kind:'type',w,prompt:'Type the pinyin (like on your worksheet)',typed:'',answers:[w.p,...w.alt],say:w.h});
const customQ = c => ({kind:'mc',prompt:c.q,big:c.big,answer:c.opts[0],options:shuffle(c.opts),font:c.han?'han':'ui',say:c.han?c.opts[0]:'',reveal:''});
function pickQs(words, n, nType, customs){
  const qs=(customs||[]).map(customQ);
  let ws=shuffle(words); while(ws.length<n) ws=ws.concat(shuffle(words));
  ws.slice(0,nType).forEach(w=>qs.push(typeQ(w)));
  const k=Math.max(0,n-qs.length);
  ws.slice(nType,nType+k).forEach(w=>qs.push(mcVocab(w,words)));
  return shuffle(qs);
}
function makeQuiz(L){
  if(L.boss) return pickQs(ORDER,20,4,[]);
  return pickQs(L.cards,10,2,shuffle(L.custom||[]).slice(0,2));
}
function missWords(){ return Object.entries(state.miss).sort((a,b)=>b[1]-a[1]).map(([h])=>W[h]).filter(Boolean); }
function fresh(q){
  const c={...q,res:undefined,chosen:undefined,typed:''};
  if(q.kind==='mc'&&!q.fixed) c.options=shuffle(q.options);
  return c;
}

/* pinyin checking: accepts tone marks (nǐ) or tone numbers (ni3); v or ü */
const MARKS={'ā':'a1','á':'a2','ǎ':'a3','à':'a4','ē':'e1','é':'e2','ě':'e3','è':'e4','ī':'i1','í':'i2','ǐ':'i3','ì':'i4',
  'ō':'o1','ó':'o2','ǒ':'o3','ò':'o4','ū':'u1','ú':'u2','ǔ':'u3','ù':'u4','ǖ':'v1','ǘ':'v2','ǚ':'v3','ǜ':'v4','ü':'v0'};
function pyKey(s){
  s=String(s).toLowerCase().normalize('NFC'); let L='',T='';
  for(const ch of s){ const m=MARKS[ch];
    if(m){ L+=m[0]; if(m[1]!=='0') T+=m[1]; }
    else if(ch>='1'&&ch<='4') T+=ch;
    else if(ch>='a'&&ch<='z') L+=ch; }
  return {L:L.replace(/v/g,'u'),T};
}
function checkPy(input, answers){
  const a=pyKey(input); if(!a.L) return 'wrong'; let almost=false;
  for(const ans of answers){ const b=pyKey(ans); if(a.L===b.L){ if(a.T===b.T) return 'right'; almost=true; } }
  return almost?'almost':'wrong';
}

      ${!last?`<button class="link skip" data-act="quiz">Skip to the test</button>`:''}
    </div>
    <div class="dock"><button class="btn ghost" data-act="prev" ${k===0?'disabled':''}>Back</button>
      <button class="btn" data-act="next">${last?'Start challenge':'Next'}</button></div>`;
  window.scrollTo(0,0);
}

/* ---------------- quiz ---------------- */
function begin(L, queue, hearts, extra){
  quiz={L,queue,total:queue.length,hearts,maxH:hearts,mistakes:0,right:0,combo:0,xp:0,answered:false,...extra};
  renderQuiz();
}
const startQuiz = li => { const L=LEVELS[li]; begin(L, makeQuiz(L), L.boss?5:3, {li}); };
function startReview(){
  const ws=missWords().slice(0,10); if(!ws.length) return renderMap();
  begin({id:'review',name:'Mistake practice',glyph:'复'}, pickQs(ws, Math.min(10,Math.max(5,ws.length)), Math.min(2,ws.length), []), 3, {review:true});
}
function mcHTML(q){
  const A=quiz.answered; let top='';
  if(q.listen) top=`<button class="play" data-say="${esc(q.speak)}" aria-label="Play the sound again">${SPK}</button><div class="speakrow"><button class="speak" data-say="${esc(q.speak)}" data-slow="1">Play slower</button></div>`;
  else if(q.big) top=`<div class="qbig"><span class="han" style="font-size:${Math.round(bigSize(q.big)*.85)}px">${esc(q.big)}</span>
      ${q.speak&&canSpeak&&q.answer!==q.w?.p?`<button class="mini" data-say="${esc(q.speak)}" aria-label="Play sound">${SPK}</button>`:''}</div>`;
  const two = q.font==='han' ? q.options.every(o=>[...o].length<=5) : q.options.every(o=>o.length<=14);
  const opts=q.options.map((o,i)=>{ let c='opt'+(q.font==='han'?' hanopt':'');
    if(A){ if(o===q.answer) c+=' right'; else if(i===q.chosen) c+=' wrong'; }
    return `<button class="${c}" data-act="opt" data-v="${i}" ${A?'disabled':''}>${esc(o)}</button>`; }).join('');
  return `${top}<div class="opts ${two?'two':''}">${opts}</div>`;
}
function typeHTML(q){
  const A=quiz.answered;
  return `<div class="qbig"><span class="han" style="font-size:${Math.round(bigSize(q.w.h)*.85)}px">${q.w.h}</span></div>
    <input id="pyin" class="pyin ${A?q.res:''}" type="text" autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false"
      placeholder="e.g. ni3 hao3  or  nǐ hǎo" value="${esc(q.typed)}" ${A?'disabled':''} aria-label="Pinyin">
    <p class="hint">Put the tone number after each syllable (hao3), or type tone marks. Use v for ü (nv3).</p>
    ${A?'':`<div class="dock"><button class="btn" data-act="checkpy">Check</button></div>`}`;
}
const PRAISE=[['很好！','Hěn hǎo! Very good'],['对了！','Duì le! Correct'],['太棒了！','Tài bàng le! Awesome']];
function sheetHTML(q){
  const r=q.res;
  const [zh,en]= r==='right'?PRAISE[Math.random()*3|0] : r==='almost'?['差一点！','Chà yìdiǎn! So close']:['加油！','Jiāyóu! Keep going'];
  let body;
  if(q.kind==='type') body = r==='right' ? `<b>${esc(q.w.p)}</b>, ${esc(M(q.w))}`
      : r==='almost' ? `The letters are right. Check the tones: <b>${esc(q.w.p)}</b>`
      : `Answer: <b>${esc(q.w.p)}</b>, ${esc(M(q.w))}`;
  else body=(r==='right'?'':`Answer: <b>${q.font==='han'?`<span class="han">${esc(q.answer)}</span>`:esc(q.answer)}</b>${q.reveal?'<br>':''}`)+(q.reveal||'');
  const cls=r==='right'?'ok':r==='almost'?'mid':'no';
  return `<div class="sheet ${cls}" role="status"><div class="sheet-top"><div class="buddy">${guy(r==='right'?'happy':r==='almost'?'calm':'oops')}</div><div class="sheet-txt">
    <div class="fb-h"><span class="han">${zh}</span><small>${en}</small>${r==='right'?`<span class="xp">+${q.gain} XP</span>`:''}</div>
    ${body?`<div class="fb-b">${body}</div>`:''}</div></div>
    <button class="btn ${r==='wrong'?'red':''}" data-act="continue">Continue</button></div>`;
}
function renderQuiz(){
  const Q=quiz, q=Q.queue[0];
  app.innerHTML=`<div class="bar"><button class="x" data-act="map" aria-label="Quit challenge">×</button>
    <div class="prog"><i style="width:${Q.right/Q.total*100}%"></i></div>
    <span class="hearts" aria-label="${Q.hearts} hearts left">${'♥'.repeat(Q.hearts)}<span class="lost">${'♥'.repeat(Q.maxH-Q.hearts)}</span></span></div>
    <div class="screen">${Q.combo>=3?`<div class="combo">Combo ×${Q.combo}</div>`:''}
      <h2 class="prompt">${esc(q.prompt)}</h2>${q.kind==='type'?typeHTML(q):mcHTML(q)}</div>
    ${Q.answered?sheetHTML(q):''}`;
  if(!Q.answered){ window.scrollTo(0,0); if(q.autoplay) setTimeout(()=>say(q.speak),400);
    const inp=document.getElementById('pyin'); if(inp) inp.focus({preventScroll:true}); }
}
function grade(res){
  const Q=quiz, q=Q.queue[0], ok=res==='right'; Q.answered=true; q.res=res;
  if(ok){ Q.right++; Q.combo++; q.gain=10+(Q.combo>=3?5:0); Q.xp+=q.gain; if(Q.review&&q.w) delete state.miss[q.w.h]; }
  else { Q.combo=0; if(q.w) state.miss[q.w.h]=(state.miss[q.w.h]||0)+1;
    if(res==='wrong'){ Q.hearts--; Q.mistakes++; }
    if(Q.hearts>0) Q.queue.push(fresh(q)); }
  save(); beep(ok); setTimeout(()=>say(q.say),ok?200:350);
  renderQuiz();
}
function checkTyped(){
  const q=quiz.queue[0], inp=document.getElementById('pyin'); if(!inp||quiz.answered) return;
  q.typed=inp.value.trim(); if(!q.typed){ inp.focus(); return; }
  grade(checkPy(q.typed,q.answers));
}
function next(){
  const Q=quiz; Q.queue.shift(); Q.answered=false;
  if(Q.hearts<=0||!Q.queue.length) finish(); else renderQuiz();
}

/* ---------------- result ---------------- */
function finish(){
  const Q=quiz, L=Q.L, failed=Q.hearts<=0;
  state.xp+=Q.xp;
  if(Q.review){
    save(); const left=Object.keys(state.miss).length;
    app.innerHTML=`<div class="result"><div class="stampwrap"><div class="stamp han in">复</div><div class="buddy">${guy(left?'calm':'happy')}</div></div>
      <h2>${left?'Good practice':'Every mistake fixed'}</h2><p>+${Q.xp} XP. ${left?`${left} word${left>1?'s':''} still to practise.`:'Your mistake list is empty.'}</p>
      <div class="actions">${left?'<button class="btn" data-act="review">Practise again</button><button class="link" data-act="map">Back to map</button>':'<button class="btn" data-act="map">Back to map</button>'}</div></div>`;
    window.scrollTo(0,0); return;
  }
  let s=0; if(!failed){ s=Q.mistakes===0?3:Q.mistakes===1?2:1; state.stars[L.id]=Math.max(state.stars[L.id]||0,s); }
  save();
  const nextL=LEVELS[Q.li+1];
  app.innerHTML = failed
    ? `<div class="result fail"><div class="stampwrap"><div class="stamp han">再</div><div class="buddy">${guy('oops')}</div></div><h2>Out of hearts</h2>
        <p>再来一次 (zài lái yí cì), one more time. Missed words are saved in "Practise my mistakes".</p>
        <div class="actions"><button class="btn" data-act="retry">Try again</button>
        ${L.boss?'':'<button class="btn ghost" data-act="cards">Review the cards</button>'}
        <button class="link" data-act="map">Back to map</button></div></div>`
    : `<div class="result"><div class="stampwrap"><div class="stamp han in">${L.glyph}</div><div class="buddy">${guy('happy')}</div></div>
        ${L.boss?`<div class="dragon-win">${SCENES.dragon()}</div>`:''}
        <h2>${L.boss?'过关！ HSK 1 exam passed':L.name+' cleared'}</h2>
        <div class="bigstars" aria-label="${s} of 3 stars">${'★'.repeat(s)}<span>${'★'.repeat(3-s)}</span></div>
        <p>+${Q.xp} XP. ${Q.mistakes?`${Q.mistakes} mistake${Q.mistakes>1?'s':''}; replay for 3 stars.`:'A perfect run.'}</p>
        <div class="actions"><button class="btn" data-act="map">${nextL?'Continue to '+nextL.name:'Back to map'}</button>
        <button class="link" data-act="retry">Play again</button></div></div>`;
  window.scrollTo(0,0);
}

/* ---------------- events ---------------- */
function openLevel(i){ const L=LEVELS[i]; if(L.boss) startQuiz(i); else renderLearn(i,0); }
app.addEventListener('click', e=>{
  const b=e.target.closest('button'); primeSpeech(); if(!b||b.disabled) return;
  if(b.dataset.say){ say(b.dataset.say, !!b.dataset.slow); if(!b.dataset.act) return; }
  if(b.dataset.lv!==undefined) return openLevel(+b.dataset.lv);
  const v=+b.dataset.v, q=quiz&&quiz.queue[0];
  switch(b.dataset.act){
    case 'map': if(canSpeak) speechSynthesis.cancel(); renderMap(); break;
    case 'prev': renderLearn(cur.li,cur.k-1); break;
    case 'next': cur.k===LEVELS[cur.li].cards.length-1 ? startQuiz(cur.li) : renderLearn(cur.li,cur.k+1); break;
    case 'test': startQuiz(v); break;
    case 'quiz': startQuiz(cur.li); break;
    case 'opt': if(quiz.answered) return; q.chosen=v; grade(q.options[v]===q.answer?'right':'wrong'); break;
    case 'checkpy': checkTyped(); break;
    case 'continue': next(); break;
    case 'retry': quiz.review ? startReview() : startQuiz(quiz.li); break;
    case 'cards': renderLearn(quiz.li,0); break;
    case 'review': startReview(); break;
    case 'list': revealed.clear(); renderList(); window.scrollTo(0,0); break;
    case 'hidepy': listOpt.py=!listOpt.py; revealed.clear(); renderList(); break;
    case 'hidear': listOpt.ar=!listOpt.ar; revealed.clear(); renderList(); break;
    case 'rev': { const k=b.dataset.k, i=parseInt(k), w=ORDER[i]; if(!b.classList.contains('hid')) return;
      revealed.add(k); b.classList.remove('hid'); b.textContent=k.endsWith('p')?w.p:M(w); if(k.endsWith('p')) say(w.h); break; }
    case 'lang': state.lang=state.lang==='en'?'id':'en'; save(); renderMap(); break;
    case 'reset': if(confirm('Reset all stars, XP and mistakes?')){ state={stars:{},xp:0,miss:{},lang:state.lang}; save(); renderMap(); } break;
  }
});
app.addEventListener('input', e=>{ if(e.target.id==='pyin'&&quiz) quiz.queue[0].typed=e.target.value; });
app.addEventListener('keydown', e=>{ if(e.target.id==='pyin'&&e.key==='Enter'){ e.preventDefault(); checkTyped(); } });

load().then(renderMap);

</script>
</body>
